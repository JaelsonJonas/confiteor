<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a3597"/>
      <stop offset="1" stop-color="#2e1248"/>
    </linearGradient>
    <linearGradient id="stole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d6fcc"/>
      <stop offset=".5" stop-color="#c9a6ec"/>
      <stop offset="1" stop-color="#9d6fcc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d98b"/>
      <stop offset="1" stop-color="#c79a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".28" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="cross">
      <rect x="-7" y="-26" width="14" height="52" rx="2"/>
      <rect x="-20" y="-13" width="40" height="14" rx="2"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
