name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe dos scripts
        run: for f in js/*.js js/dados/*.js; do node --check "$f"; done
      - name: Rodar testes (Node)
        run: node --test tests/
      - name: Rodar testes (Python)
        run: python3 -m unittest discover -s tests -v
      - name: Verificar scripts de instalação
        run: bash -n install.sh && bash -n uninstall.sh
