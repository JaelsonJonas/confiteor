<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confiteor</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div class="top" id="top">
    <button class="ib" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="bar" role="progressbar" aria-label="Progresso"><i id="bar"></i></div>
    <button class="ib" id="menu" aria-label="Seções"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="foot" id="foot"></div>
</div>

<div class="layer" id="sheet">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Seções">
    <div class="grab"></div>
    <h4>Seções</h4>
    <div id="jumps"></div>
  </div>
</div>

<div class="layer" id="dlg">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <p id="dlgmsg">Apagar todas as marcações? Isso não pode ser desfeito.</p>
    <div class="foot inline">
      <button class="btn perigo" id="yes">Apagar tudo</button>
      <button class="btn ghost" id="no">Cancelar</button>
    </div>
  </div>
</div>

<!-- Scripts comuns (não módulos), para funcionar também abrindo o arquivo direto no navegador. -->
<script src="js/dados/perguntas.js"></script>
<script src="js/dados/exemplos.js"></script>
<script src="js/dados/oracoes.js"></script>
<script src="js/logica.js"></script>
<script src="js/app.js"></script>
</body>
</html>
