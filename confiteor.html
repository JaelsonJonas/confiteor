<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confiteor</title>
<style>
/* Formulário gradual: uma pergunta por tela, respostas em cartões grandes,
   progresso fino no topo, ação principal fixa embaixo. Roxo litúrgico + dourado. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#16121b);--ink:light-dark(#1d1724,#eee8f3);--muted:light-dark(#655c70,#a99fb4);
--vio:light-dark(#5a2d82,#c7a3ea);--vio-ink:light-dark(#ffffff,#1b1322);--soft:light-dark(#f4eef9,#241c2d);
--line:light-dark(#e3daec,#382e44);--head:light-dark(#4a2370,#271b35);--gold:light-dark(#9c7a26,#d8b865);
--red:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif;overflow:hidden;transition:background .3s}
body.hero{background:var(--head);color:#fff}
#app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;gap:6px;padding:10px 10px 4px}
.top[hidden]{display:none}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover:not(:disabled){background:var(--soft)}
.ib:disabled{opacity:.25;cursor:default}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:0 6px}
.bar i{display:block;height:100%;width:0;background:var(--vio);border-radius:2px;transition:width .4s cubic-bezier(.2,.7,.2,1)}

/* palco */
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 24px 16px}
.screen{animation:in .34s cubic-bezier(.2,.7,.2,1) both}
.screen.back{animation-name:inb}
.screen.still{animation:none}
@keyframes in{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0 18px;font-size:14px;font-weight:600;color:var(--muted)}
.chip{font-size:13px;padding:2px 10px;border-radius:12px;background:var(--soft);color:var(--vio)}
.qt{font:400 clamp(23px,5.6vw,28px)/1.32 "Cormorant Garamond",Georgia,serif;margin:0 0 30px;text-wrap:pretty}
.sub{margin:-18px 0 28px;color:var(--muted);font-size:16px}

/* cartões de resposta */
.exbtn{display:inline-flex;align-items:center;gap:6px;margin:-16px 0 22px;padding:6px 2px;border:0;background:transparent;color:var(--vio);font:600 15px "Source Sans 3",system-ui,sans-serif;cursor:pointer}
.exbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.exbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.ex{list-style:none;margin:-10px 0 24px;padding:14px 16px;border-radius:14px;background:var(--soft);display:grid;gap:8px;font-size:15px;line-height:1.45;animation:up .22s ease both}
.ex li{padding-left:16px;position:relative}
.ex li::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.ex li.obs{color:var(--muted);font-style:italic;padding-left:0}
.ex li.obs::before{display:none}
.choices{display:grid;gap:12px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:14px 18px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);font:600 18px "Source Sans 3",system-ui,sans-serif;text-align:left;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.choice:hover{border-color:var(--vio)}
.choice:active{transform:scale(.985)}
.choice .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;transition:border-color .15s}
.choice[aria-pressed=true]{border-color:var(--vio);background:var(--soft)}
.choice[aria-pressed=true] .r{border-color:var(--vio)}
.choice[aria-pressed=true] .r::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--vio)}
.choice kbd{margin-left:auto;font:600 12px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* detalhes ao marcar Pequei */
.det{display:grid;gap:20px;margin-top:28px;animation:up .28s ease both}
.field{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.field small{font-weight:400}
input:not([type=checkbox]){width:100%;font:400 19px "Source Sans 3",system-ui,sans-serif;padding:8px 2px;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;color:var(--ink);transition:border-color .15s}
input:not([type=checkbox]):focus{outline:none;border-bottom-color:var(--vio)}
.rel{margin:-10px 0 0;min-height:22px;font-size:15px;color:var(--muted)}
.rel b{color:var(--vio)}
.rel .err{color:var(--red)}
.act{margin:26px 0 0;padding:18px 18px 14px;border-radius:16px;border:1.5px solid var(--line)}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.act h3{margin:0;font:700 24px "Cormorant Garamond",Georgia,serif;color:var(--vio)}
.seg.sm{margin:0;grid-template-columns:auto auto}
.seg.sm button{min-height:34px;padding:0 12px;font-size:14px}
.act-x{margin:0 0 12px;font:400 21px/1.45 "Cormorant Garamond",Georgia,serif;text-wrap:pretty}
.act-n{margin:0;font-size:14px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:400;color:var(--ink);cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--vio);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin:4px 0 20px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font:600 15px "Source Sans 3",system-ui,sans-serif;color:var(--muted);cursor:pointer}
.seg button[aria-selected=true]{background:var(--bg);color:var(--vio);box-shadow:0 1px 3px rgba(0,0,0,.14)}
input::placeholder{color:var(--muted);opacity:.6}

/* telas de abertura de seção */
.part{font-size:14px;font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin:28px 0 10px}
h2{font:700 clamp(34px,8vw,44px)/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 10px;color:var(--vio);text-wrap:balance}
.lede{font-size:18px;color:var(--muted);margin:0 0 22px}
.rule{width:44px;height:3px;border-radius:2px;background:var(--gold);margin:0 0 22px}
.meta{font-size:15px;color:var(--muted)}
.hint{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:15px;margin:22px 0 0;color:var(--ink)}

/* boas-vindas */
.welcome{display:flex;flex-direction:column;justify-content:flex-end;min-height:100%;padding-bottom:12px}
.welcome svg{width:44px;height:56px;margin-bottom:26px}
h1{font:700 clamp(40px,10vw,54px)/1.02 "Cormorant Garamond",Georgia,serif;margin:0 0 16px;text-wrap:balance}
.welcome p{margin:0;color:#e6dcef;font-size:18px;max-width:34ch}

/* rodapé de ação */
.foot{padding:10px 24px 22px;display:grid;gap:4px}
.foot:empty{display:none}
.btn{min-height:54px;width:100%;border-radius:27px;border:0;background:var(--vio);color:var(--vio-ink);font:600 17px "Source Sans 3",system-ui,sans-serif;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--vio);min-height:44px}
.btn.danger{background:transparent;color:var(--red);min-height:44px}
.hero .btn{background:#fff;color:#4a2370}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* resumo */
.sum h3{font:700 22px "Cormorant Garamond",Georgia,serif;color:var(--vio);margin:24px 0 4px}
.sum ol{list-style:none;margin:0;padding:0}
.sum li{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.sum li>div{flex:1}
.sum .meta{font-size:14px;margin-top:2px}
.edit{flex:none;border:0;background:transparent;color:var(--vio);font:600 14px "Source Sans 3",sans-serif;cursor:pointer;padding:4px 6px;border-radius:6px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:22px 0 0}
.toast{font-size:14px;color:var(--gold);min-height:20px;margin-top:10px;text-align:center}
textarea{width:100%;min-height:180px;font:15px "Source Sans 3",sans-serif;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea.conf{min-height:0;overflow:hidden;font:16px/1.55 "Source Sans 3",system-ui,sans-serif;padding:14px;resize:vertical}
textarea.conf:focus{outline:none;border-color:var(--vio)}

/* camadas: seções e confirmação */
.layer{position:fixed;inset:0;background:rgba(10,5,15,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.layer.on{display:flex}
.panel{background:var(--bg);color:var(--ink);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:10px 20px 20px;max-height:85%;overflow-y:auto;animation:sheet .28s cubic-bezier(.2,.7,.2,1) both}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.panel h4{margin:0 0 8px;font:700 24px "Cormorant Garamond",Georgia,serif;color:var(--vio)}
.panel p{margin:0 0 18px}
.jump{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 6px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:600 16px "Source Sans 3",sans-serif;text-align:left;cursor:pointer}
.jump:hover{color:var(--vio)}
.jump .c{margin-left:auto;font-weight:400;font-size:14px;color:var(--muted)}
.jump .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.jump .nodot{width:8px;flex:none}
.jump[aria-current=true]{color:var(--vio)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<div class="top" id="top">
<button class="ib" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<div class="bar" role="progressbar" aria-label="Progresso"><i id="bar"></i></div>
<button class="ib" id="menu" aria-label="Seções"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
</div>
<main class="stage" id="stage" aria-live="polite"></main>
<div class="foot" id="foot"></div>
</div>

<div class="layer" id="sheet"><div class="panel" role="dialog" aria-modal="true" aria-label="Seções"><div class="grab"></div><h4>Seções</h4><div id="jumps"></div></div></div>
<div class="layer" id="dlg"><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div>
<p>Apagar todas as marcações? Isso não pode ser desfeito.</p>
<div class="foot" style="padding:0"><button class="btn" id="yes" style="background:var(--red);color:#fff">Apagar tudo</button><button class="btn ghost" id="no">Cancelar</button></div>
</div></div>

<script>
{
const S=[
{k:'1º',t:'1º mandamento',s:'Amar a Deus sobre todas as coisas',g:[[null,'Deixei de crer fielmente em tudo o que Deus revelou, ou duvidei voluntariamente de alguma doutrina da Igreja Católica Apostólica Romana? Li, assinei, publiquei, propaguei, emprestei livros, folhetos, revistas ou jornais hostis a Deus e à santa religião? Dei ouvido a conversas ou discursos ímpios ou heréticos? Assisti à sessão espírita, ao culto protestante ou de religiões não cristãs? Abandonei a única Igreja verdadeira, que é a Católica, para abraçar seita falsa? Faltei com a confiança em Deus e na divina graça? Consultei espíritas ou cartomantes? Consultei videntes? Desesperei da minha salvação ou fui presunçoso, esperando encontrá-la sem deixar o pecado? Cometi pecados no intuito de confessá-los mais tarde? Deixei de rezar por muito tempo? Falei mal de Deus, contra a sua Santa Mãe, Maria Santíssima, contra os santos, contra a Igreja e seus ministros? Rezei sem devoção, com distrações voluntárias?']]},
{k:'2º',t:'2º mandamento',s:'Não tomar seu santo nome em vão',g:[[null,'Profanei o Santíssimo Sacramento, pessoas, lugares ou coisas consagradas a Deus? Blasfemei contra Deus? Comunguei em estado de pecado grave? Recebi algum sacramento indignamente, sem estar devidamente preparado? Jurei o seu santo nome sem necessidade? Pronunciei levianamente o nome de Deus? Deixei de cumprir uma promessa? Faço de má vontade as coisas relacionadas com Deus?']]},
{k:'3º',t:'3º mandamento',s:'Guardar domingos e festas',g:[[null,'Deixei de participar da Santa Missa inteira aos domingos e dias de preceito por própria culpa? Profanei a Igreja com conversas, olhares indiscretos, namoros, por usar um traje indecente? Trabalhei ou mandei trabalhar desnecessariamente nos domingos ou dias de guarda?']]},
{k:'4º',t:'4º mandamento',s:'Honrar pai e mãe',g:[['Para os filhos','Desrespeitei os pais falando-lhes asperamente ou respondendo-lhes mal? Murmurei contra meus pais? Desobedeci? Obedeci de má vontade? Descuidei dos pais na velhice, na pobreza ou na doença (sustento, últimos sacramentos: levar os pais para recebê-los ou chamar um padre para ministrá-los)? Desejei mal a meus pais? Deixei de rezar por meus pais?'],['Para os pais','Protelei o batismo de meus filhos, a sua primeira comunhão? Descuidei-me da educação física, intelectual e principalmente religiosa dos meus filhos? Deixei de fazer o que estava ao meu alcance para que fossem à Santa Missa aos domingos e festas de guarda, à catequese? Descuidei de suas boas leituras, ou deixei de reprimir divertimentos impróprios? Dei-lhes mau exemplo? Deixei de corrigi-los? Castiguei-os, não com caridade, mas com ira?']]},
{k:'5º',t:'5º mandamento',s:'Não matar',g:[[null,'Odiei o próximo? Desejei mal ao próximo? Procurei vingar-me? Não tive caridade com os pobres, doentes e necessitados? Prejudiquei minha saúde por excesso de comida e bebida, sobretudo bebidas alcoólicas? Usei drogas? Agi contra a própria vida ou contra a vida do próximo, ou alimentei pensamentos nesse sentido? Abortei, colaborei ou incentivei o aborto? Tive pensamentos de praticar, colaborar ou incentivar o aborto? Usei, entreguei, recomendei a "pílula do dia seguinte"? Levei alguém a pecar ou fui causa de escândalo? Roguei pragas? Dei mau exemplo ou tratei mal as pessoas que estão ao meu redor? Maltratei animais? Descuidei da minha formação religiosa e moral e também da formação das pessoas que moram comigo ou dependem de mim? Guardo inimizade, ódio ou rancor contra alguém? Deixei que divergências políticas, profissionais ou qualquer outro tipo de diferença degenerassem em indisposição, má vontade ou ódio com relação a alguém? Feri os outros por palavras ou ações? Empreguei em alguma ocasião a violência física?']]},
{k:'6º e 9º',t:'6º e 9º mandamentos',s:'Não pecar contra a castidade · Não desejar a mulher do próximo',g:[[null,'Consenti em pensamentos sensuais e em maus desejos? Olhei indiscreta e maliciosamente para coisas indecentes, pessoas mal vestidas? Tive conversas impuras? Li e olhei sites, livros ou revistas, estampas, filmes, séries, vídeos ou fotografias obscenas e imorais? Pratiquei atos impuros comigo mesmo (masturbação), com outra pessoa, do mesmo sexo ou de outro sexo? Faltei com o pudor e a modéstia em meus trajes?'],['Para os casados','Procurei satisfação carnal fora do matrimônio (adultério ou masturbação)? Abusei do matrimônio, evitando ter filhos sem necessidade grave ou de maneira condenada pela Igreja? Aconselhei meios para evitar filhos dessa maneira?']]},
{k:'7º e 10º',t:'7º e 10º mandamentos',s:'Não furtar · Não cobiçar as coisas alheias',g:[[null,'Roubei, furtei, aceitei objetos furtados, guardei-os? Tive vontade de roubar ou furtar? Não restituí ao dono um objeto achado ou emprestado? Deixei de pagar as dívidas sem motivo de força maior (desemprego, calamidade, necessidade maior para o sustento da vida)? Fiz dívidas que sabia que não poderia pagar? Não paguei ao funcionário o salário justo? Dei prejuízo voluntário ao próximo? Desperdicei o dinheiro em jogo ou com caprichos e futilidades? Aceitei ou pedi suborno? Cometi alguma fraude? Enganei os outros cobrando mais do que o justo por um produto, serviço etc.? Retenho ou atraso indevidamente pagamentos e salários que devo pagar?']]},
{k:'8º',t:'8º mandamento',s:'Não levantar falso testemunho',g:[[null,'Menti? Violei segredos? Dei falso testemunho? Supus más intenções? Abri cartas alheias? Fiz juízos temerários? Fingi doenças, pobreza, piedade para enganar os outros? Dei ouvido a conversas contra a vida alheia? Revelei, sem motivo justo, defeitos graves de outras pessoas? Falei ou pensei mal dos outros? Caluniei alguém? Deixei de ser exemplar no meu trabalho? Uso os bens da empresa em proveito próprio ou sem a justiça necessária?']]},
{k:'Igreja',t:'Mandamentos da Igreja',s:'',g:[[null,'Fiquei mais de um ano sem confessar meus pecados? Não fiz a comunhão pascal? Não guardei jejum e abstinência na Quarta-feira de Cinzas e na Sexta-feira Santa? Não guardei abstinência de carne nas sextas-feiras do ano? Não comutei a abstinência de carne das sextas-feiras em orações, obras de caridade ou outra forma de penitência?']]},
{k:'Capitais',t:'Pecados capitais',s:'Avalie sua consciência sobre os seguintes pecados',g:[[null,['Soberba, orgulho: desprezar os demais, tratá-los com desdém; querer dominar.','Avareza: pensar somente em ganhar dinheiro e acumular fortuna, sem nada gastar com os pobres, ou para fins de piedade e caridade.','Impureza: procurar prazeres que mancham a alma e roubam a inocência.','Ira: ficar facilmente com raiva, impacientar-se. Deixar-se levar pelo ímpeto da cólera.','Gula: exceder-se na comida ou na bebida. Embriagar-se.','Inveja: não querer que outros estejam bem; entristecer-se com o bem-estar do próximo, empregar meios para impedir, diminuir ou destruir a felicidade do próximo.','Preguiça: perder tempo; não cumprir, por indolência, as obrigações do trabalho ou da religião.']]]}
];
/* Exemplos por pergunta (id = seção-grupo-pergunta). "Obs.:" = observação para evitar escrúpulos. */
const E={
'0-0-0':['Rejeitar conscientemente um dogma, como a presença real de Jesus na Eucaristia ou a virgindade de Maria.','Alimentar de propósito dúvidas sobre a fé, sem procurar esclarecimento.','Escolher em que acreditar da doutrina conforme a conveniência.','Obs.: dúvidas que surgem sem querer, quando a pessoa procura resposta, não são pecado.'],
'0-0-1':['Compartilhar nas redes sociais memes, vídeos ou textos que zombam da fé.','Assinar ou divulgar abaixo-assinados e campanhas contra a Igreja.','Emprestar ou recomendar livros que atacam a fé a quem não tem preparo para lê-los.'],
'0-0-2':['Assistir com gosto a vídeos ou podcasts que ridicularizam a fé.','Rir ou concordar em conversas que zombam de Deus, em vez de me afastar ou defender a fé.'],
'0-0-3':['Participar de sessão espírita, de rituais de umbanda ou candomblé, ou de "limpezas espirituais".','Trocar a Missa de domingo por um culto de outra religião.','Obs.: estar presente por caridade, como no casamento ou velório de um parente, não é o que esta pergunta aponta.'],
'0-0-4':['Deixar a fé católica para entrar em outra religião ou grupo religioso.','Declarar-me de outra religião por conveniência: casamento, emprego ou aceitação social.'],
'0-0-5':['Achar que Deus não se importa comigo ou não vai me ajudar numa dificuldade.','Deixar a ansiedade tomar conta, como se tudo dependesse só de mim.','Reclamar de Deus nas dificuldades, como se Ele tivesse me abandonado.'],
'0-0-6':['Tirar cartas de tarô, jogar búzios ou ler a mão.','Consultar horóscopo ou mapa astral para tomar decisões.','Usar simpatias, amuletos ou patuás para ter sorte ou proteção.'],
'0-0-7':['Procurar alguém que diz prever o futuro ou falar com os mortos.','Ligar para serviços de vidência ou seguir perfis de previsões para orientar a vida.'],
'0-0-8':['Desespero: pensar que meu pecado é grande demais e que Deus não vai me perdoar.','Presunção: continuar num pecado pensando que Deus é bom e depois perdoa.'],
'0-0-9':['Planejar um pecado porque "no sábado eu me confesso".','Adiar a mudança de vida, usando a confissão como uma borracha.'],
'0-0-10':['Passar dias ou semanas sem nenhuma oração, nem pela manhã nem à noite.','Rezar só quando estou em apuros.'],
'0-0-11':['Fazer piadas desrespeitosas sobre Nossa Senhora ou os santos.','Espalhar críticas ou fofocas sobre padres e bispos sem motivo justo.','Culpar Deus com raiva pelas coisas ruins que acontecem.'],
'0-0-12':['Rezar o terço ou acompanhar a Missa pensando de propósito em outras coisas.','Rezar com pressa, só para cumprir obrigação.','Obs.: distrações que vêm sem querer, quando a pessoa tenta voltar a atenção, não são pecado.'],

/* Data da última confissão (dd/mm/aaaa) -> tempo aproximado para dizer ao padre */
function lastRel(){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(P.ud||'');if(!m)return null;
const d=+m[1],mo=+m[2],y=+m[3],t=Date.UTC(y,mo-1,d),dt=new Date(t);
if(y<1900||dt.getUTCDate()!==d||dt.getUTCMonth()!==mo-1)return{err:'Data inválida.'};
const n=new Date(),days=Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-t)/864e5);
if(days<0)return{err:'Essa data ainda não chegou.'};
if(days===0)return{r:'hoje'};if(days===1)return{r:'ontem'};

const mm=Math.round(days/30.4375),a=Math.floor(mm/12),b=mm%12,pa=a?(a===1?'1 ano':a+' anos'):'',pb=b?(b===1?'1 mês':b+' meses'):'';
return{r:'há '+(pa&&pb?pa+' e '+pb:pa||pb)}}

const cross=`<svg viewBox="0 0 44 56" aria-hidden="true"><rect x="18" y="0" width="8" height="56" rx="2" fill="#d8b865"/><rect x="4" y="14" width="36" height="8" rx="2" fill="#d8b865"/></svg>`;

function render(anim=true){
ST=steps();idx=Math.max(0,Math.min(idx,ST.length-1));const s=ST[idx];
document.body.classList.toggle('hero',s.t==='welcome');
$('top').hidden=s.t==='welcome';
$('back').disabled=idx===0;
$('bar').style.width=(idx/(ST.length-1)*100)+'%';
let h='',f='';
if(s.t==='welcome'){
h=`<div class="welcome">${cross}<h1>Exame de Consciência</h1><p>Antes de começar, peça a luz do Espírito Santo para conhecer bem os seus pecados. Nada do que você marcar é salvo: ao fechar a página, tudo se apaga.</p></div>`;
f=`<button class="btn" id="next">Começar</button>`;
}else if(s.t==='setup'){const d=SETUP[s.f];
h=`<div class="eyebrow">Antes de começar · ${'cfu'.indexOf(s.f)+1} de 3</div><p class="qt">${d.h}</p>${s.f==='c'?'<p class="sub">Três perguntas rápidas para adaptar o exame a você.</p>':''}<div class="choices">${d.o.map(([v,l],i)=>choice(i,l,i+1,P[s.f]===v)).join('')}</div>`+
(s.f==='u'&&P.u==='sim'?`<div class="det"><label class="field"><span>Data da última confissão</span><input id="ultima" data-p="ud" inputmode="numeric" maxlength="10" value="${esc(P.ud)}" autocomplete="off" placeholder="dd/mm/aaaa"></label><p class="rel" id="rel" aria-live="polite">${relHTML()}</p><label class="field"><span>Não lembra a data? <small>Diga há quanto tempo, aproximadamente</small></span><input data-p="ut" value="${esc(P.ut)}" autocomplete="off" placeholder="Ex.: 2 meses, 1 ano"></label></div>`:'');
f=s.f==='u'&&P.u==='sim'?`<button class="btn" id="next">Continuar</button>`:'';
}else if(s.t==='intro'){const sec=S[s.si];const done=Q.filter(x=>x.si===s.si&&ok(x.req)&&A[x.id]&&A[x.id].v).length;
h=`<div class="part">Parte ${s.part} de ${s.parts}</div><h2>${esc(sec.t)}</h2>${sec.s?`<p class="lede">${esc(sec.s)}</p>`:''}<div class="rule"></div><p class="meta">${s.n} ${s.n>1?'perguntas':'pergunta'}${done?` · ${done} respondida${done>1?'s':''}`:''}</p>`+
(s.si===0?`<p class="hint">Cada pergunta descreve uma falta. Marque <b>Pequei</b> quando reconhecer que a cometeu. Só os itens marcados como Pequei vão para o resumo.</p>`:'');
f=`<button class="btn" id="next">${done?'Continuar':'Começar'}</button>`;
}else if(s.t==='q'){const x=s.x,a=A[x.id]||{},v=a.v||'';
h=`<div class="eyebrow"><span>${esc(S[x.si].t)}</span><span aria-hidden="true">·</span><span>${s.k+1} de ${s.n}</span>${x.label?`<span class="chip">${esc(x.label)}</span>`:''}</div><p class="qt" id="qt">${esc(x.q)}</p>${E[x.id]?`<button class="exbtn" id="exbtn" aria-expanded="${SHOWEX}" aria-controls="ex">${SHOWEX?'Ocultar exemplos':'Ver exemplos'}<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>${SHOWEX?`<ul class="ex" id="ex">${E[x.id].map(t=>t.startsWith('Obs.:')?`<li class="obs">${esc(t)}</li>`:`<li>${esc(t)}</li>`).join('')}</ul>`:''}`:''}<div class="choices" role="group" aria-labelledby="qt">${choice(0,'Pequei','P',v==='p')}${choice(1,'Não','N',v==='n')}</div>`+
(v==='p'?`<div class="det"><label class="field"><span>Quantas vezes? <small>(aproximadamente)</small></span><input id="vezes" inputmode="numeric" data-f="n" value="${esc(a.n||'')}" autocomplete="off" placeholder="Ex.: 2"></label><label class="field"><span>Observação <small>(opcional)</small></span><input data-f="o" value="${esc(a.o||'')}" autocomplete="off" placeholder="Algo que queira lembrar"></label>${P.u==='nunca'?'':`<label class="chk"><input type="checkbox" data-f="f" ${a.f?'checked':''}>Esqueci de confessar isto na última confissão</label>`}</div>`:'');
f=v==='p'?`<button class="btn" id="next">Continuar</button>`:v?'':`<button class="btn ghost" id="skip">Pular esta pergunta</button>`;
}else{const any=Q.some(isP);
const tabs=any?`<div class="seg" role="tablist"><button role="tab" data-tab="conf" aria-selected="${TAB==='conf'}">Texto para a confissão</button><button role="tab" data-tab="list" aria-selected="${TAB==='list'}">Lista por mandamento</button></div>`:'';
let body;
if(!any)body=`<p class="empty">Nenhum ponto marcado ainda. Volte às seções para fazer o exame.</p>`;
else if(TAB==='conf'){const t=confText(),hasObs=Q.some(x=>isP(x)&&A[x.id].o&&A[x.id].o.trim());
body=`<p class="hint" style="margin:0 0 16px">Gerado a partir das suas respostas, dos pontos mais graves para os mais leves. Edite à vontade antes de copiar: junte, corrija ou retire o que quiser.</p>`+
(hasObs?`<label class="chk"><input type="checkbox" id="incobs" ${INCOBS?'checked':''}>Incluir minhas observações no texto</label>`:'')+
`<textarea id="conf" class="conf" spellcheck="false" aria-label="Texto para a confissão" rows="${t.split('\n').length+2}">${esc(t)}</textarea><div id="regenw">${CONF.edited?'<button class="edit" id="regen">Refazer o texto a partir das respostas</button>':''}</div>`+
`<section class="act" aria-labelledby="acth"><div class="act-h"><h3 id="acth">Ato de contrição</h3><div class="seg sm" role="tablist" aria-label="Versão do ato de contrição">${Object.entries(ACTS).map(([k,a])=>`<button role="tab" data-act="${k}" aria-selected="${ACT===k}">${a.t}</button>`).join('')}</div></div><p class="act-x">${esc(ACTS[ACT].x)}</p><p class="act-n">Reze depois que o padre der a penitência. A versão escolhida também vai no final do texto acima.</p></section>`+
`<p class="note">Na confissão basta dizer o tipo de pecado e quantas vezes, sem citar nomes de outras pessoas.</p>`}
else body=`<p class="lede">Somente os pontos marcados como Pequei, por mandamento.</p><div class="sum">`+S.map((sec,i)=>{const ps=Q.filter(x=>x.si===i&&isP(x));return ps.length?`<h3>${esc(sec.t)}</h3><ol>${ps.map(x=>{const a=A[x.id],m=[esc(fmtN(a.n)),a.o?esc(a.o):'',a.f&&P.u!=='nunca'?'esquecido na última confissão':''].filter(Boolean).join(' · ');return `<li><div>${esc(x.q)}${m?`<div class="meta">${m}</div>`:''}</div><button class="edit" data-edit="${x.id}">Editar</button></li>`}).join('')}</ol>`:''}).join('')+`</div>`;
h=`<div class="part">Fim do exame</div><h2>Resumo para a confissão</h2>${tabs}${body}<div id="fallback"></div><p class="note">Ao fechar esta página, todas as marcações se apagam. Nada fica salvo.</p>`;
f=`${any?`<button class="btn" id="copy">${TAB==='conf'?'Copiar texto':'Copiar lista'}</button>`:`<button class="btn" id="restart">Voltar ao início</button>`}<div class="toast" id="toast"></div><button class="btn danger" id="clr">Apagar tudo</button>`;
}
stage.innerHTML=`<div class="screen ${anim?(dir<0?'back':''):'still'}">${h}</div>`;
foot.innerHTML=f;fit();
if(anim)stage.scrollTop=0;
}

function go(i,d){clearTimeout(timer);dir=d??(i>=idx?1:-1);idx=i;render();const n=$('next');if(n&&!n.disabled)n.focus({preventScroll:true});else{const c=stage.querySelector('.choice[aria-pressed=true]')||stage.querySelector('.choice');if(c)c.focus({preventScroll:true})}}
const next=()=>{if(idx<ST.length-1)go(idx+1,1)};
const back=()=>{if(idx>0)go(idx-1,-1)};
const find=fn=>ST.findIndex(fn);
const canNext=()=>{const s=ST[idx];return s.t==='setup'?P[s.f]!==null:s.t==='q'?!!(A[s.x.id]&&A[s.x.id].v):true};
const advance=()=>{const n=$('next');if(n){if(!n.disabled)n.click()}else if(canNext())next()};

function pick(i){const s=ST[idx];
if(s.t==='setup'){const v=SETUP[s.f].o[i][0];P[s.f]=v;render(false);if(s.f==='u'&&v==='sim'){const u=$('ultima');if(u)u.focus({preventScroll:true})}else timer=setTimeout(next,260);return}
if(s.t!=='q')return;
const id=s.x.id,v=i===0?'p':'n';A[id]=A[id]||{};A[id].v=v;render(false);
if(v==='p'){const n=$('vezes');if(n)n.focus({preventScroll:true});n&&n.scrollIntoView({block:'nearest',behavior:'smooth'})}
else timer=setTimeout(next,260)}

function sumText(){let out='';S.forEach((s,i)=>{const ps=Q.filter(x=>x.si===i&&isP(x));if(!ps.length)return;out+=s.t+'\n';ps.forEach(x=>{const a=A[x.id],n=fmtN(a.n);out+='• '+x.q+(n?` (${n})`:'')+(a.o?` — ${a.o}`:'')+(a.f&&P.u!=='nunca'?' [esquecido na última confissão]':'')+'\n'});out+='\n'});return out.trim()}
function fb(t){if(TAB==='conf'&&$('conf')){$('conf').focus();$('conf').select();$('toast').textContent='Selecione o texto e copie.';return}$('fallback').innerHTML='<textarea readonly></textarea>';const ta=document.querySelector('#fallback textarea');ta.value=t;ta.select();$('toast').textContent='Selecione o texto abaixo e copie.'}

function openSheet(){const cur=ST[idx];const curSi=cur.t==='intro'?cur.si:cur.t==='q'?cur.x.si:-1;
$('jumps').innerHTML=`<button class="jump" data-jump="setup" aria-current="${cur.t==='setup'}"><span class="nodot"></span>Antes de começar</button>`+
S.map((s,i)=>{const qs=Q.filter(x=>x.si===i&&ok(x.req));const d=qs.filter(x=>A[x.id]&&A[x.id].v).length;return `<button class="jump" data-jump="${i}" aria-current="${curSi===i}">${qs.some(isP)?'<span class="dot"></span>':'<span class="nodot"></span>'}${esc(s.t)}<span class="c">${d}/${qs.length}</span></button>`}).join('')+
`<button class="jump" data-jump="sum" aria-current="${cur.t==='sum'}"><span class="nodot"></span>Resumo</button>`;
$('sheet').classList.add('on');const c=$('jumps').querySelector('[aria-current=true]')||$('jumps').firstChild;c.focus()}
const closeLayers=()=>{$('sheet').classList.remove('on');$('dlg').classList.remove('on')};
const layerOpen=()=>$('sheet').classList.contains('on')||$('dlg').classList.contains('on');

document.addEventListener('click',e=>{const t=e.target;
if(t.classList.contains('layer')){closeLayers();return}
const c=t.closest('.choice');if(c){pick(+c.dataset.c);return}
const b=t.closest('button');if(!b)return;
switch(b.id){
case 'next':case 'skip':next();return;
case 'back':back();return;
case 'menu':openSheet();return;
case 'exbtn':SHOWEX=!SHOWEX;render(false);$('exbtn').focus({preventScroll:true});return;
case 'restart':go(find(s=>s.t==='intro'));return;
case 'copy':{const conf=TAB==='conf'&&$('conf'),txt=conf?$('conf').value:sumText(),toast=$('toast'),ok=conf?'Texto copiado.':'Lista copiada.';try{navigator.clipboard.writeText(txt).then(()=>{toast.textContent=ok},()=>fb(txt))}catch(err){fb(txt)}return}
case 'regen':CONF={base:null,text:'',edited:false};render(false);return;
case 'clr':$('dlg').classList.add('on');$('no').focus();return;
case 'yes':A={};P={c:null,f:null,u:null,ut:'',ud:''};TAB='conf';INCOBS=false;CONF={base:null,text:'',edited:false};closeLayers();go(0,-1);return;
case 'no':closeLayers();return;
}
if(b.dataset.act){const old=ACTS[ACT].x;ACT=b.dataset.act;if(CONF.edited)CONF.text=CONF.text.split(old).join(ACTS[ACT].x);render(false);return}
if(b.dataset.tab){TAB=b.dataset.tab;render(false);return}
if(b.dataset.jump!==undefined){const j=b.dataset.jump;closeLayers();go(j==='setup'?1:j==='sum'?ST.length-1:find(s=>s.t==='intro'&&s.si===+j));return}
if(b.dataset.edit){go(find(s=>s.t==='q'&&s.x.id===b.dataset.edit),-1)}
});
stage.addEventListener('input',e=>{const t=e.target,s=ST[idx];
if(t.id==='conf'){CONF.text=t.value;fit();if(!CONF.edited){CONF.edited=true;$('regenw').innerHTML='<button class="edit" id="regen">Refazer o texto a partir das respostas</button>'}return}
if(t.dataset.p){if(t.dataset.p==='ud'){const g=t.value.replace(/\D/g,'').slice(0,8);t.value=g.length>4?g.slice(0,2)+'/'+g.slice(2,4)+'/'+g.slice(4):g.length>2?g.slice(0,2)+'/'+g.slice(2):g}
P[t.dataset.p]=t.value;const r=$('rel');if(r)r.innerHTML=relHTML();return}
const f=t.dataset.f;if(!f||s.t!=='q')return;A[s.x.id][f]=t.type==='checkbox'?t.checked:t.value});
stage.addEventListener('change',e=>{if(e.target.id==='incobs'){INCOBS=e.target.checked;CONF={base:null,text:'',edited:false};render(false)}});

document.addEventListener('keydown',e=>{
if(e.key==='Escape'){closeLayers();return}
if(layerOpen()||e.ctrlKey||e.metaKey||e.isComposing)return;
const tg=e.target instanceof Element?e.target:document.body,inInput=tg.matches('input,textarea');
if(e.key==='Enter'){if(inInput||!tg.matches('button')){e.preventDefault();advance()}return}
if(inInput)return;
const k=e.key.toLowerCase(),s=ST[idx];
if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();back();return}
if(e.key==='ArrowRight'){advance();return}
if(s.t==='setup'&&(k==='1'||k==='2'))pick(+k-1);
if(s.t==='q'){if(k==='p'||k==='1')pick(0);else if(k==='n'||k==='2')pick(1);else if(k==='e'&&$('exbtn'))$('exbtn').click()}
});

render();
}
</script>
</body>
</html>
